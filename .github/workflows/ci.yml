name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS 26 image (Apple silicon): each Xcode on it is 26.x, and the sidecar's tensor
    # metallib needs the macOS 26 SDK (scripts/build-sidecar.sh). macos-latest moves on its own.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Metal Toolchain when missing
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Engine tests must run on the CPU in CI (no Metal on hosted runners). The device
      # switch arrives with the engine adapter (T1-5 and Phase 2); set it here then.
      - run: pnpm check
