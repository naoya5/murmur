# Build settings shared by every cargo invocation in this workspace.

[env]
# The minimum macOS of the app. rustc, cc and the CMake build of speech.cpp (crates/speech-sys)
# all read it, so every object in the binary agrees. Keep it equal to
# `bundle.macOS.minimumSystemVersion` in src-tauri/tauri.conf.json.
MACOSX_DEPLOYMENT_TARGET = "14.0"
# Only the standalone sidecar (crates/murmur-llm) reads this; speech.cpp sets its own Metal
# options in crates/speech-sys/build.rs. Compile the Metal shaders at build time into
# default.metallib, so no process compiles shader source at load (a cache miss costs ~10 s).
# `xcrun metal` takes its minimum macOS from MACOSX_DEPLOYMENT_TARGET above; the tensor-API
# metallib sets macOS 26 itself and is loaded only on GPUs that support it.
GGML_METAL_EMBED_LIBRARY = "OFF"
