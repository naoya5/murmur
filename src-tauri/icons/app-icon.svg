<!--
  SOT: app-icon
  What:  the master of the Murmur app icon, "Ember wave" (proposal A, chosen 2026-11-06). Five amber
         bars, lit like the one ember light of the UI, on a dark warm rounded square.
  Why:   every app icon file in this folder is generated from it, so the icon changes in one place.
         The rounded square is 824 px, centered on the 1024 px canvas, with a transparent margin and
         a soft shadow (the macOS icon grid). macOS 26 shows it as is from 64 px up; at 16 and
         32 px it puts this .icns (and the old blue icon) on a gray plate; an Icon Composer icon
         is the expected way to avoid that. The rim light and the glow are part of the art, because the
         OS adds no Liquid Glass effects to a plain .icns.
  Where: regenerate in three steps.
         1. `pnpm tauri icon src-tauri/icons/app-icon.svg -o <tmp>`, then copy only the files that
            already exist in src-tauri/icons (the bundle does not use the android/ and ios/ output).
         2. At 16 x 16 px the five bars blur into one shape, so icon.icns takes its 16 px image
            from app-icon-16.svg, drawn on the pixel grid: `iconutil -c iconset <tmp>/icon.icns`,
            `rsvg-convert -w 16 -h 16 app-icon-16.svg -o <iconset>/icon_16x16.png`,
            `iconutil -c icns <iconset> -o src-tauri/icons/icon.icns`.
         3. The menu bar glyph (tray.png, tray@2x.png) is a separate one-color drawing of the same
            five bars; it does not change with this file.
-->
