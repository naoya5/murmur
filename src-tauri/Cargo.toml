[package]
name = "murmur"
description = "Murmur: local, private speech-to-text for macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "murmur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
murmur-core = { path = "../crates/murmur-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
specta.workspace = true

[lints]
workspace = true
